<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokenDroid Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div>
        <h2>TokenDroid</h2>
        <span>Analytics</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="live"><span class="dot"></span><span id="timestamp">Connecting...</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Overview</h1>
        <span class="range" id="date-range"></span>
      </div>
      <div class="topbar-right">
        <div class="topbar-filters">
          <select class="filter-select" id="filter-project">
            <option value="">All Projects</option>
          </select>
          <select class="filter-select" id="filter-model">
            <option value="">All Models</option>
          </select>
        </div>
        <span class="badge">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          Auto-refresh 30s
        </span>
      </div>
    </header>

    <main class="content">
      <div class="kpi-grid" id="kpi-grid"></div>
      <div id="panes">
        <p class="empty-state">Loading data...</p>
      </div>
    </main>
  </div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
